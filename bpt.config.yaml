schema: bpt/v1
project: my-app
adapter: placeholder

# "sides" are named trees. This is an OPEN list: a web app uses backend + frontend,
# a CLI would use just [cli], a service just [service]. BPT is not tied to the web.
sides:
  backend:  { root: apps/backend/behaviors,  kernel: apps/backend/kernel }
  frontend: { root: apps/frontend/behaviors, kernel: apps/frontend/kernel }

contracts: { root: packages/contracts }

# Each node is a behavior. The convention folder path plus this entry ARE the
# complete declaration. There is no per-node metadata file.
#
# This template ships with 2 real, valid nodes. Advanced examples
# (one-sided node, per-side deps, grouping by prd) live in docs/RULEBOOK.md.
nodes:
  - id: product.list
    sides: [backend, frontend]
    deps: []

  - id: product.detail
    sides: [backend, frontend]
    deps: [product.list]   # "detail" consumes the "list" contract
