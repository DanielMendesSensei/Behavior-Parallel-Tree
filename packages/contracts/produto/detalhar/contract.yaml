# Contrato neutro de produto.detalhar.
id: produto.detalhar
version: 1
kind: query
title: Detalhar produto

authorization:
  required: true
  roles: [cliente]

input:
  produtoId: { type: text, required: true }

output:
  id:         { type: text }
  nome:       { type: text }
  descricao:  { type: text }
  preco:      { type: money }
  disponivel: { type: boolean }

rules:
  - id: sem-acao-de-compra-quando-indisponivel
    describe: produto indisponivel aparece com aviso e sem acao de compra

errors:
  - code: PRODUTO_NAO_ENCONTRADO
    category: user
    retryable: false
    when: produtoId nao existe
  - code: NAO_AUTORIZADO
    category: user
    retryable: false
    when: sessao ausente ou expirada
