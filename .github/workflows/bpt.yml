name: bpt

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: bpt checks itself
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the validator's only dependency
        run: python -m pip install --disable-pip-version-check -r tools/bpt/requirements.txt
      # The same command a contributor runs locally, on purpose: CI and the
      # working copy must agree on what green means, and the checks must not
      # be hostage to anyone's build minutes.
      - name: ./bpt check
        run: ./bpt check
