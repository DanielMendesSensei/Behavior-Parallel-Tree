# BPT placeholder adapter.
# Honors the entire interface, but knows no stack.
# A real adapter (e.g. web-ts, python-fastapi) replaces the scripts in hooks/
# while keeping this same protocol and hook names.
name: placeholder
version: 1
command: adapters/placeholder/bin/bpt-adapter

# Execution unit = the node per side, keyed by (side, id).
# Each worktree is one side, one invocation, one deploy target.
execution_unit: side-node

hooks: [scaffold, plan, execute, verify, review, codegen]

notes: |
  Only the scaffold hook does real work (it creates the mirrored folders plus the
  spec and contract stubs, by convention). The others return an empty ok status.
  Real orchestration (worktrees, wave-based parallelism, the 3-attempt loop,
  yolo mode, the bilateral contract test) is the responsibility of a real adapter,
  described in docs/ADAPTER.md.
